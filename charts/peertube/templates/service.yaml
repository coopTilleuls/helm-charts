---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-peertube
spec:
  selector:
    app: peertube
  ports:
    - protocol: TCP
      port: 25
      targetPort: 25
      name: smtp
    - protocol: TCP
      port: {{ .Values.ports.nginxproxyPort }}
      targetPort: {{ .Values.ports.nginxproxyPort }}
      name: nginx-proxy
    - protocol: TCP
      port: {{ .Values.ports.peertubePort }}
      targetPort: {{ .Values.ports.peertubePort }}
      name: peertube
    - protocol: TCP
      name: rtmp
      port: 1935
      targetPort: 1935
